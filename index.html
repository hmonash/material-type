<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Type Lab - v20</title>
    <style>
        :root { --bg: #f4f1ea; --ui: rgba(255, 252, 245, 0.98); --accent: #d1ccc0; --text: #4a453f; }
        body { margin: 0; overflow: hidden; background: var(--bg); font-family: 'Times New Roman', serif; }
        #ui { position: absolute; top: 20px; left: 20px; width: 280px; padding: 20px; background: var(--ui); border: 1px solid var(--accent); border-radius: 4px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); z-index: 100; color: var(--text); }
        h1 { font-size: 14px; text-transform: uppercase; letter-spacing: 2px; margin: 0 0 15px 0; border-bottom: 1px solid var(--accent); padding-bottom: 5px; }
        .group { margin-bottom: 15px; }
        label { font-size: 10px; text-transform: uppercase; color: #8c867a; display: block; margin-bottom: 4px; }
        input, select { width: 100%; padding: 8px; border: 1px solid #c8c3b9; border-radius: 2px; box-sizing: border-box; font-family: inherit; }
        .status { font-size: 11px; margin-top: 10px; font-style: italic; color: #a19b8f; background: #eee; padding: 5px; border-radius: 2px; }
    </style>
</head>
<body>

    <div id="ui">
        <h1>Material Type Lab</h1>
        <div class="group">
            <label>Text</label>
            <input type="text" id="wordInput" placeholder="Try B, C, D..." value="C">
        </div>
        <div class="group">
            <label>Material</label>
            <select id="matSelect">
                <option value="glass">Material: Glass (FBX)</option>
                <option value="felt">Material: Felt (STL)</option>
            </select>
        </div>
        <div class="group">
            <label>Spacing</label>
            <input type="range" id="spacingInput" min="40" max="250" value="115">
        </div>
        <div class="status" id="statusMsg">Ready.</div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { STLLoader } from 'three/addons/loaders/STLLoader.js';
        import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 1, 10000);
        camera.position.set(0, 200, 700);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        scene.add(new THREE.AmbientLight(0xffffff, 0.9));
        const p1 = new THREE.PointLight(0xffffff, 1.5); p1.position.set(300, 500, 400); scene.add(p1);

        const wordGroup = new THREE.Group();
        scene.add(wordGroup);

        const mats = {
            felt: new THREE.MeshStandardMaterial({ color: 0x8c867a, roughness: 1 }),
            glass: new THREE.MeshPhysicalMaterial({
                color: 0x88ccff, metalness: 0, roughness: 0.1,
                transmission: 0.8, thickness: 5, ior: 1.5,
                transparent: true, opacity: 0.9,
                side: THREE.DoubleSide
            })
        };

        const loaders = { stl: new STLLoader(), fbx: new FBXLoader() };
        const TARGET_HEIGHT = 150; // Larger to be safer

        function centerWord() {
            const b = new THREE.Box3().setFromObject(wordGroup);
            const c = new THREE.Vector3(); b.getCenter(c);
            wordGroup.position.x = -c.x;
        }

        async function update() {
            const text = document.getElementById('wordInput').value.toUpperCase();
            const mat = document.getElementById('matSelect').value;
            const spacing = parseFloat(document.getElementById('spacingInput').value);
            const status = document.getElementById('statusMsg');

            wordGroup.clear();
            wordGroup.position.set(0,0,0);
            status.innerText = "Attempting to load...";

            for (let i = 0; i < text.length; i++) {
                const char = text[i];
                const charGroup = new THREE.Group();
                charGroup.position.x = i * spacing;
                wordGroup.add(charGroup);

                const indicator = new THREE.Mesh(
                    new THREE.BoxGeometry(30, 30, 30),
                    new THREE.MeshBasicMaterial({ color: 0x0000ff, wireframe: true })
                );
                charGroup.add(indicator);

                const path = mat === 'glass' ? `./glass-${char.toLowerCase()}.fbx` : `./felt-${char}.stl`;
                status.innerText = `Loading: ${path}...`;

                try {
                    if (mat === 'glass') {
                        const fbx = await new Promise((res, rej) => loaders.fbx.load(path, res, undefined, rej));
                        fbx.traverse(c => { if (c.isMesh) c.material = mats.glass; });
                        
                        // Force update matrix and get box
                        const b = new THREE.Box3().setFromObject(fbx);
                        const s = new THREE.Vector3(); b.getSize(s);
                        const scaleFactor = TARGET_HEIGHT / Math.max(s.y, 0.1);
                        fbx.scale.setScalar(scaleFactor);
                        
                        // Centering logic
                        const b2 = new THREE.Box3().setFromObject(fbx);
                        const c2 = new THREE.Vector3(); b2.getCenter(c2);
                        fbx.position.sub(c2);
                        
                        charGroup.remove(indicator);
                        charGroup.add(fbx);
                    } else {
                        const geo = await new Promise((res, rej) => loaders.stl.load(path, res, undefined, rej));
                        const mesh = new THREE.Mesh(geo, mats.felt);
                        geo.computeBoundingBox();
                        const s = new THREE.Vector3(); geo.boundingBox.getSize(s);
                        mesh.scale.setScalar(TARGET_HEIGHT / Math.max(s.y, 0.1));
                        geo.center();
                        mesh.rotation.x = -Math.PI/2;
                        charGroup.remove(indicator);
                        charGroup.add(mesh);
                    }
                    centerWord();
                    status.innerText = "Success.";
                } catch (e) {
                    console.error("Error loading file:", e);
                    status.innerText = `FAIL: ${path}`;
                    indicator.material.color.set(0xff0000);
                }
            }
            centerWord();
        }

        document.getElementById('wordInput').oninput = update;
        document.getElementById('matSelect').onchange = update;
        document.getElementById('spacingInput').oninput = update;
        window.onresize = () => { camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); };

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        update();
        animate();
    </script>
</body>
</html>
